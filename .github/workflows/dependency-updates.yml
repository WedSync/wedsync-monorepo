name: 🔄 Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8.6.12'

jobs:
  update-dependencies:
    name: 📦 Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Update dependencies
        run: |
          echo "🔍 Checking for dependency updates..."
          pnpm update --latest --recursive

      - name: Run tests after update
        run: |
          pnpm install
          pnpm type-check
          pnpm lint
          pnpm test
        continue-on-error: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies (${{ steps.date.outputs.date }})"
          title: "🔄 Weekly Dependency Updates - ${{ steps.date.outputs.date }}"
          body: |
            ## 📦 Automated Dependency Updates

            This PR contains the weekly dependency updates for all packages in the monorepo.

            ### Changes Made
            - Updated all dependencies to their latest compatible versions
            - Ran full test suite to ensure compatibility
            - Updated lock file with new versions

            ### Testing Status
            - ✅ Type checking passed
            - ✅ Linting passed
            - ✅ Tests passed

            ### Review Checklist
            - [ ] Review dependency changes for breaking updates
            - [ ] Check for any new vulnerabilities
            - [ ] Verify all applications build successfully
            - [ ] Test critical functionality in preview deployments

            ---
            🤖 This PR was created automatically by the dependency update workflow.
          branch: chore/dependency-updates-${{ steps.date.outputs.date }}
          delete-branch: true
          draft: false

  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: |
          echo "🔍 Running security audit..."
          pnpm audit --audit-level moderate

      - name: Check for known vulnerabilities
        run: |
          echo "🔍 Checking for known vulnerabilities with npm audit..."
          npm audit --audit-level moderate

      - name: Generate security report
        run: |
          echo "📊 Generating security report..."
          pnpm audit --audit-level low --json > security-audit.json || true

          if [ -s security-audit.json ]; then
            echo "⚠️  Security vulnerabilities found. Please review the report."
          else
            echo "✅ No security vulnerabilities found."
          fi

      - name: Upload security report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-audit-report
          path: security-audit.json
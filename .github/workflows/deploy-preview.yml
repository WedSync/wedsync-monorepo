name: 🚀 Deploy Preview

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8.6.12'

jobs:
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      wedsync: ${{ steps.changes.outputs.wedsync }}
      wedme: ${{ steps.changes.outputs.wedme }}
      admin: ${{ steps.changes.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            wedsync:
              - 'wedsync/**'
              - 'packages/**'
            wedme:
              - 'wedme/**'
              - 'packages/**'
            admin:
              - 'admin/**'
              - 'packages/**'

  deploy-wedsync-preview:
    name: 🚀 Deploy WedSync Preview
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.wedsync == 'true'
    environment:
      name: wedsync-preview-pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WedSync
        run: pnpm build --filter=wedsync
        env:
          NODE_ENV: production

      - name: Deploy to Vercel (Preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEDSYNC_PROJECT_ID }}
          working-directory: ./wedsync
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v6
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('WedSync Preview')
            );

            const body = `## 🚀 WedSync Preview Deployed

            **Preview URL:** ${{ steps.deploy.outputs.preview-url }}

            This preview will be automatically updated when you push new changes to this PR.

            | App | Status |
            |-----|--------|
            | WedSync | ✅ Deployed |
            | WedMe | ${{ needs.changes.outputs.wedme == 'true' && '⏳ Building' || '⏸️ No changes' }} |
            | Admin | ${{ needs.changes.outputs.admin == 'true' && '⏳ Building' || '⏸️ No changes' }} |
            `;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  deploy-wedme-preview:
    name: 🚀 Deploy WedMe Preview
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.wedme == 'true'
    environment:
      name: wedme-preview-pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WedMe
        run: pnpm build --filter=wedme
        env:
          NODE_ENV: production

      - name: Deploy to Vercel (Preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEDME_PROJECT_ID }}
          working-directory: ./wedme
          scope: ${{ secrets.VERCEL_ORG_ID }}

  deploy-admin-preview:
    name: 🚀 Deploy Admin Preview
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    environment:
      name: admin-preview-pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin
        run: pnpm build --filter=admin
        env:
          NODE_ENV: production

      - name: Deploy to Vercel (Preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          working-directory: ./admin
          scope: ${{ secrets.VERCEL_ORG_ID }}

  lighthouse-audit:
    name: 🔦 Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: [deploy-wedsync-preview, deploy-wedme-preview]
    if: always() && (needs.deploy-wedsync-preview.result == 'success' || needs.deploy-wedme-preview.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: '.github/lighthouse/lighthouserc.js'
        env:
          WEDSYNC_PREVIEW_URL: ${{ needs.deploy-wedsync-preview.outputs.preview-url }}
          WEDME_PREVIEW_URL: ${{ needs.deploy-wedme-preview.outputs.preview-url }}
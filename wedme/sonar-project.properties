# WedMe Application - SonarQube Configuration
sonar.projectKey=wedme-app
sonar.projectName=WedMe Client Platform
sonar.projectVersion=1.0.0
sonar.projectDescription=WedMe client-focused wedding planning platform

# Source and test configuration
sonar.sources=src
sonar.tests=src/**/*.test.ts,src/**/*.test.tsx,__tests__

# Exclusions specific to Next.js app
sonar.exclusions=\
  **/.next/**,\
  **/node_modules/**,\
  **/coverage/**,\
  **/dist/**,\
  **/out/**,\
  **/*.d.ts,\
  **/tailwind.config.js,\
  **/postcss.config.*,\
  **/next.config.*

# Coverage paths
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Language settings
sonar.typescript.tsconfigPath=tsconfig.json
# ===========================================
# SonarQube Project Configuration
# ===========================================
sonar.projectKey=wedsync-monorepo
sonar.projectName=WedSync Monorepo
sonar.projectVersion=1.0.0
sonar.projectDescription=WedSync wedding management platform monorepo with supplier tools

# ===========================================
# Source Code Configuration
# ===========================================
# Source directories (all TypeScript/JavaScript code)
sonar.sources=wedsync/src,wedme/src,admin/src,packages/ui/src,packages/types/src,packages/utils/src,packages/database/src,packages/config/src

# Test directories (no wildcards allowed)
sonar.tests=

# ===========================================
# Language and File Settings
# ===========================================
sonar.typescript.file.suffixes=.ts,.tsx
sonar.javascript.file.suffixes=.js,.jsx,.mjs
sonar.css.file.suffixes=.css,.scss,.sass,.less
sonar.html.file.suffixes=.html,.htm,.xhtml
sonar.json.file.suffixes=.json

# ===========================================
# Exclusions (Files to ignore)
# ===========================================
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/out/**,\
  **/.turbo/**,\
  **/public/**,\
  **/*.d.ts,\
  **/tailwind.config.js,\
  **/postcss.config.*,\
  **/next.config.*,\
  **/jest.config.*,\
  **/vitest.config.*,\
  **/.eslintrc.*,\
  **/*.stories.*,\
  **/storybook-static/**,\
  **/.storybook/**,\
  **/pnpm-lock.yaml,\
  **/package-lock.json,\
  **/yarn.lock

# Test file exclusions from main analysis
sonar.test.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/out/**,\
  **/.turbo/**

# ===========================================
# Coverage and Testing
# ===========================================
# Coverage report paths (multiple formats supported)
sonar.javascript.lcov.reportPaths=\
  coverage/lcov.info,\
  wedsync/coverage/lcov.info,\
  wedme/coverage/lcov.info,\
  admin/coverage/lcov.info,\
  packages/*/coverage/lcov.info

sonar.typescript.lcov.reportPaths=\
  coverage/lcov.info,\
  wedsync/coverage/lcov.info,\
  wedme/coverage/lcov.info,\
  admin/coverage/lcov.info,\
  packages/*/coverage/lcov.info

# Generic test results
sonar.testExecutionReportPaths=\
  coverage/test-results.xml,\
  wedsync/coverage/test-results.xml,\
  wedme/coverage/test-results.xml,\
  admin/coverage/test-results.xml

# ===========================================
# Code Quality and Analysis Settings
# ===========================================
# Wait for quality gate result
sonar.qualitygate.wait=true

# New Code Period (Clean as You Code)
sonar.newCode.period=previous_version

# Analysis settings
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
sonar.scm.forceReloadAll=false

# ===========================================
# TypeScript/JavaScript Specific Settings
# ===========================================
# ESLint reports
sonar.eslint.reportPaths=\
  eslint-report.json,\
  wedsync/eslint-report.json,\
  wedme/eslint-report.json,\
  admin/eslint-report.json

# TypeScript compiler configuration
sonar.typescript.tsconfigPath=tsconfig.json

# ===========================================
# Security and Vulnerability Analysis
# ===========================================
# Enable security analysis
sonar.security.analysis.enabled=true

# ===========================================
# Performance and Analysis Optimization
# ===========================================
# Log level for analysis
sonar.log.level=INFO

# Working directory
sonar.working.directory=.sonar

# ===========================================
# Clean as You Code Configuration
# ===========================================
# Focus on new code issues
sonar.newCode.period=30

# Quality gate focused on new code
sonar.qualitygate.wait=true

# Branch analysis
sonar.branch.name=${BRANCH_NAME}
sonar.branch.target=main

# ===========================================
# Additional Analysis Parameters
# ===========================================
# Duplication detection
sonar.cpd.js.minimumTokens=50
sonar.cpd.ts.minimumTokens=50

# Cognitive complexity threshold
sonar.typescript.complexity.threshold=15
sonar.javascript.complexity.threshold=15